<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registro</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shorcut icon" href="/Logo.jpg" type="image/icon.jpg">
    <link rel="stylesheet" href="/Registrarse.css">
</head>
<body>
        <form action="/api/registrarse" method="post">
        <div class="tarjeta-login">
            <h1>Registro</h1>
            <br>
            <label for="usuario">Nuevo usuario</label>
            <input type="text" name="usuario" id="usuario" placeholder="Ingrese su nuevo usuario" required>
            <br>
            <label for="contraseña">Nueva contraseña</label>
            <input type="password" name="contrasena" id="contrasena" placeholder="Ingrese su nueva contraseña" required>
            <br>
            <label for="confirmar-contraseña">Confirmar contraseña</label>
            <input type="password" name="contrasenaConfirmada" id="contrasenaConfirmada" placeholder="Confirme su nueva contraseña" required>
            <br>
            <button type="submit" id="submit">Registrar</button>
            <br><br>
            <p th:if="${error}" th:text="${error}"></p>
            <br>
            <a class="enlace" href="/index.html">Iniciar sesión</a>
        </div>
    </form>
</body>
</html>
