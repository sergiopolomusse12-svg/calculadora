<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, user-scalable=no, initial-scale=1.0,maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shortcut icon" href="Logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="techos.css">
</head>
<body>
    <header> 
        <div class="Logo">
            <img src="Logo.jpg" alt="Logo de la empresa">
            <h1>M.S.S</h1>
        </div>
        <nav>
            <a href="calculadora2.html" class="nav-link salir">Salir</a>
        </nav>
    </header>

    <form>
        <section class="tarjeta">
            <label for="espesorTecho">Espesor (m):</label>
            <input class="tarjeta" type="number" id="espesorTecho" >
            <br>
            <label for="anchoTecho">Ancho (m):</label>
            <input class="tarjeta" type="number" id="anchoTecho">
            <br>
            <label for="largoTecho">Largo (m):</label>
            <input class="tarjeta" type="number" id="largoTecho">
            <br>
            <button class="boton" type="button" id="btnCalcularTecho">Calcular</button>
            <p id="resultadoTecho"></p>

        </section>
    </form>
    <script src="/techos.js" defer></script>
</body>
</html>
