<head>

<body>
        <nav>
        <div class="tarjeta-login">
            <h1>Registro</h1>
            <br>
            <label for="usuario">Nuevo usuario</label>
            <input type="text" name="usuario" id="usuario" placeholder="Ingrese su nuevo usuario">

            <input type="password" name="contraseña" id="contraseña" placeholder="Ingrese su nueva contraseña">

            <label for="confirmar-contraseña">Confirmar contraseña</label>
            <input type="password" name="confirmar-contraseña" id="confirmar-contraseña" placeholder="Confirme su nueva contraseña">
            <br>
            <button type="button" id="btnRegistrar">Registrar</button>
            <br>
