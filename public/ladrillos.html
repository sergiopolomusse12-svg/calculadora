<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, user-scalable=no, initial-scale=1.0,maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shortcut icon" href="Logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="ladrillos.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <script src="https://kit.fontawesome.com/2c36e9b7b1.js"crossorigin="anonymous"></script>
</head>
<body>
    <header> 
        <div class="Logo">
            <img src="Logo.jpg" alt="Logo de la empresa">
            <h1>M.S.S</h1>
        </div>
        <nav>
            <a href="calculadora2.html" class="nav-link salir">Salir</a>
        </nav>
    </header>
    <form>
        <section id="ladrillos" class="tarjeta">
        <label>Espesor del muro:</label>

        <select id="espesor" class="tarjeta">
            <option value="20">20 cm</option>
            <option value="30">30 cm</option>
        </select>

        <br><br>

        <label>Largo del muro (cm):</label>
        <input type="number" id="largo" class="tarjeta">

        <br><br>

        <label>Alto del muro (cm):</label>
        <input type="number" id="alto" class="tarjeta">

        <br><br>

        <button type="button" class="boton" py-click="calcular">
            Calcular
        </button>
    </form> 

    <p id="resultado"></p>

    <script type="py">

        from pyscript import document

        def calcular(event):

            espesor = int(document.querySelector("#espesor").value)

            largo = float(document.querySelector("#largo").value)

            alto = float(document.querySelector("#alto").value)

            largo = largo / 100
            alto = alto / 100

            superficie = largo * alto

            if espesor == 20:

                cemento = superficie * 10.9
                arena = superficie * 0.09
                ladrillos = superficie * 90

            elif espesor == 30:

                cemento = superficie * 15.2
                arena = superficie * 0.115
                ladrillos = superficie * 120

            document.querySelector("#resultado").innerText = (
                f"Superficie: {superficie:.2f} m²\n"
                f"Cemento: {cemento:.2f} kg\n"
                f"Arena: {arena:.3f} m³\n"
                f"Ladrillos: {ladrillos:.0f}"
    )


    </script>
</body>
</html>
