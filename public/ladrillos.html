<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, user-scalable=no, initial-scale=1.0,maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shortcut icon" href="Logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="ladrillos.css">
</head>
<body>
    <header> 
        <div class="Logo">
            <img src="Logo.jpg" alt="Logo de la empresa">
            <h1>M.S.S</h1>
        </div>
        <nav>
            <a href="calculadora2.html" class="nav-link salir">Salir</a>
        </nav>
    </header>
    <form>
        <section id="ladrillos" class="tarjeta">
        <label>Espesor del muro:</label>

        <select id="espesor" class="tarjeta">
            <option value="20">20 cm</option>
            <option value="30">30 cm</option>
        </select>

        <br><br>

        <label>Largo del muro (cm):</label>
        <input type="number" id="largo" class="tarjeta">

        <br><br>

        <label>Alto del muro (cm):</label>
        <input type="number" id="alto" class="tarjeta">

        <br><br>

        <button type="button" class="boton" id="btnCalcular">Calcular</button>
        
    </form> 

    <p id="resultado"></p>
    <script src="/ladrillos.js" defer></script>

</body>
</html>
