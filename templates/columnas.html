<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, user-scalable=no, initial-scale=1.0,maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shortcut icon" href="/Logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/columnas.css">
</head>
<body>
    <header> 
        <div class="Logo">
            <img src="/Logo.jpg" alt="Logo de la empresa">
            <h1>M.S.S</h1>
        </div>
        <nav>
            <a href="/calculadora2.html" class="nav-link salir">Salir</a>
        </nav>
    </header>

    <form action="/calcular-columnas" method="post">
        <section class="tarjeta">
            <label for="largoColumna">Largo de la columna (m):</label>
            <input class="tarjeta" type="number" id="largoColumna" name="largo" step="any" required>
            <button class="boton" type="submit">Calcular</button>
            <br><br>
                <div th:if="${cemento} != null">
                    <p>Cemento necesario: <span th:text="${cemento}"></span>kg</p>
                    <p>Arena necesaria: <span th:text="${arena}"></span>m³</p>
                    <p>Piedra necesaria: <span th:text="${piedra}"></span>m²</p>
                    <p>Hierro de 10mm necesario: <span th:text="${hierro10}"></span>m</p>
                    <p>Hierro de 4mm necesario: <span th:text="${hierro4}"></span>m</p>
                </div>
        </section>
    </form>
</body>
</html>
