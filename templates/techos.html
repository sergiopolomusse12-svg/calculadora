<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"content="width=device-width, user-scalable=no, initial-scale=1.0,maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Calculadora</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shortcut icon" href="/Logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="/techos.css">
</head>
<body>
    <header> 
        <div class="Logo">
            <img src="/Logo.jpg" alt="Logo de la empresa">
            <h1>M.S.S</h1>
        </div>
        <nav>
            <a href="/calculadora2.html" class="nav-link salir">Salir</a>
        </nav>
    </header>

    <form action="/calcular-techos" method="post">
        <section class="tarjeta">
            <label for="espesorTecho">Espesor (m):</label>
            <input class="tarjeta" type="number" id="espesorTecho" name="espesor" step="any" required>
            <br>
            <label for="anchoTecho">Ancho (m):</label>
            <input class="tarjeta" type="number" id="anchoTecho" name="ancho" step="any" required>
            <br>
            <label for="largoTecho">Largo (m):</label>
            <input class="tarjeta" type="number" id="largoTecho" name="largo" step="any" required>
            <br>
            <button class="boton" type="submit">Calcular</button>
            <br><br>
            <div th:if="${area != null}" >
                <p>Área del techo: <span th:text="${area}"></span> m²</p>
                <p>Cemento necesario: <span th:text="${cemento}"></span> kg</p>
                <p>Arena necesaria: <span th:text="${arena}"></span> m³</p>
                <p>Piedra necesaria: <span th:text="${piedra}"></span> m³</p>
                <p>Hierro de 8 mm necesario: <span th:text="${hierro8}"></span> m</p>
                <p>Hierro de 6 mm necesario: <span th:text="${hierro6}"></span> m</p>
            </div>
        </section>
    </form>
</body>
</html>
