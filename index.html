<!DOCTYPE html>
<html lang="es" xmlns="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Inicio de sesión</title>
    <meta name="description" content="Calculadora Interfaces">
    <meta name="keywords" content="Calculadora Interfaces">
    <meta name="author" content="M.S.S">
    <link rel="shorcut icon" href="/Logo.jpg" type="image/icon.jpg">
    <link rel="stylesheet" href="/index.css">
</head>

<body>
    <form action="/api/iniciar-sesion" method="post">
        <div class="tarjeta-login">
            <h1>Inicio de sesión</h1>
            <br>
            <label for="usuario">Usuario</label>
            <input type="text" name="usuario" id="usuario" placeholder="Ingrese su usuario" required>
            <br>
            <label for="contraseña">Contraseña</label>
            <input type="password" name="contrasena" id="contrasena" placeholder="Ingrese su contraseña" required>
            <br>
            <button type="submit">Iniciar sesión</button>
            <br><br>
            <p th:if="${error}" th:text="${error}"></p>
            <br>
            <a class="enlace" href="/Registrarse.html">Registrarse</a>
        </div>
    </form>
</body>
</html>
